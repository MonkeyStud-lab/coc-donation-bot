adb:
  # Waydroid ADB address — run `adb devices` to find yours.
  # Common values: 127.0.0.1:5555 or a LAN IP like 192.168.240.112:5555
  device: "192.168.240.112:5555"
  coc_package: "com.supercell.clashofclans"
  reconnect_max_attempts: 5
  reconnect_backoff_seconds: 2

vision:
  template_threshold: 0.82
  donate_button_threshold: 0.78
  scale_range: [0.95, 1.0, 1.05]
  ocr_confidence_threshold: 0.5

timing:
  tap_jitter_px: 6
  action_delay_ms: [120, 350]
  scan_interval_ms: [800, 1500]

runtime:
  session_limit_seconds: 14400  # 4 hours
  break_min_seconds: 600        # 10 minutes
  break_max_seconds: 900        # 15 minutes
  game_load_timeout_seconds: 90
  state_watchdog_seconds: 45

donation:
  order: ["troop", "spell", "siege"]
  handled_request_ttl_seconds: 120
  chat_max_scroll_attempts: 20
  bar_max_scroll_attempts: 8       # horizontal scrolls per troop/spell bar (open requests)
  donate_open_requests: false     # false = only donate when specific troops shown in chat
  donation_panel_wait_seconds: 3.0
