15px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:13px;text-align:left;border:0;background:transparent;padding:12px 14px;color:var(--muted);font-weight:500}.nav button:hover{background:var(--surface);color:var(--text)}.nav button.active{background:var(--raised);color:var(--accent)}.nav button .count{margin-left:auto;font-size:10px;padding:1px 6px;background:var(--field);border-radius:4px}.side-bottom{margin-top:auto;padding:18px 12px 0;border-top:1px solid var(--line)}.side-bottom select{width:100%;margin-top:9px;background:var(--field);padding:9px;border:1px solid var(--line);border-radius:6px;font-size:12px}.main{margin-left:224px;padding:82px 40px 30px;max-width:1700px}.heading{display:flex;gap:18px;justify-content:space-between;align-items:center;margin-bottom:28px}.heading p{color:var(--muted);margin-top:7px}.primary{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:650}.primary:hover{background:var(--accent);filter:brightness(1.1)}.danger{color:var(--red);background:var(--field);border-color:var(--red)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(290px,.85fr);gap:24px}.run-panel{padding:27px 28px}.run-title{margin:17px 0 8px;font-size:23px;letter-spacing:-.5px;font-weight:600}.run-panel .description{max-width:400px;color:var(--muted)}.controls{display:flex;gap:12px;margin:26px 0}.controls button{width:138px;height:43px}.timers{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:22px;gap:20px}.timer{font-size:25px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;font-weight:550;margin:5px 0}.progress{height:3px;background:var(--field);border-radius:2px;margin-top:14px;overflow:hidden}.progress span{display:block;height:100%;background:var(--acc tting-row:last-child{border-bottom:0}.setting-row p{color:var(--muted);font-size:12px;margin-top:5px;max-width:520px;overflow-wrap:anywhere}.setting-row input,.setting-row select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:10px 11px}.setting-control{display:flex;align-items:center;justify-content:flex-end;gap:10px}.switch{position:relative;width:36px;height:21px;padding:0;border:0!important;background:var(--field);border-radius:20px;flex:none}.switch:after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:transform .15s}.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(15px);background:var(--onaccent)}.savebar{position:sticky;bottom:16px;padding:14px 18px;display:flex;gap:15px;align-items:center;justify-content:space-between;border:1px solid var(--accent);border-radius:9px;background:var(--side);margin-top:25px}.notice{padding:14px 18px;background:var(--field);border-left:3px solid var(--accent);border-radius:4px;font-size:12px;color:var(--muted);margin:20px 0}.setup-grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:26px;align-items:start}.checklist{padding:17px 12px}.checklist-title{padding:5px 12px 14px}.check-row{width:100%;border:0;background:transparent;text-align:left;display:flex;gap:12px;align-items:center;padding:13px 12px;margin:3px 0;color:var(--muted)}.check-row.active{background:var(--raised);color:var(--text)}.check-row small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.check-row svg{width:17px}.step-guide{padding:26px}.step-guide h2{font-size:21px;margin:12px 0 7px}.instructions{list-style:none;padding:0;margin:24px 0}.instructions li{display:flex;gap:13px;margin:18px 0;color:var(--muted);font-size:13px}.stepnum{flex:none;width:23px;height:23px;background:var(--field);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--accent);font-size:11px}.instruction-actions{padding-top:20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}.setup-summary{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.setup-progress{max-width:260px;flex:1}.setup-progress .progress{margin-top:7px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:20px 0}.shot{overflow:hidden}.shot .scene{min-height:130px}.shot .scene svg{height:130px}.shot-info{padding:15px 17px}.shot-info p{margin-top:4px;font-size:11px;color:var(--muted)}.data-metrics{display:flex;gap:40px;margin:0 0 30px}.data-metrics strong{display:block;font-size:24px;margin:4px 0;letter-spacing:-.7px}.data-list{margin-top:20px}.data-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.data-row p{font-size:12px;color:var(--muted);margin-top:4px}.tool-row{padding:20px 22px;display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid var(--line)}.tool-row:last-child{border:0}.tool-row p{font-size:12px;color:var(--muted);max-width:520px;margin-top:4px}.tool-row button{min-width:120px;flex:none}.footer{font-size:11px;color:var(--muted);padding-top:28px;display:flex;gap:15px;justify-content:space-between}.footer a{color:var(--muted)}.toast{position:fixed;bottom:25px;left:calc(50% + 100px);transform:translateX(-50%);padding:13px 20px;background:var(--side);border:1px solid var(--accent);border-radius:9px;z-index:30;max-width:90vw}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#0009;display:grid;place-items:center;padding:25px}.modal{width:650px;max-width:100%;max-height:90vh;overflow:auto;padding:25px;background:var(--bg);border:1px solid var(--line);border-radius:13px}.modal .scene{border:1px solid var(--line);border-radius:8px;margin:20px 0;min-height:260px}.modal .scene svg{height:260px}.editor{position:relative;cursor:crosshair}.tap-marker{position:absolute;display:grid;place-items:center;width:31px;height:31px;border:2px solid var(--accent);color:var(--text);font-size:12px;border-radius:50%;background:#0007;transform:translate(-50%,-50%);pointer-events:none}.compact-help{padding:17px 0;color:var(--muted);font-size:12px}details{margin-top:22px}summary{cursor:pointer;font-size:12px;color:var(--muted);padding:7px 0}::-webkit-scrollbar{width:8px;height:6px}::-webkit-scrollbar-thumb{background:var(--raised);border-radius:9px}::-webkit-scrollbar-track{background:var(--bg)}[hidden]{display:none!important}

</head><body>
<header class="topbar"><div>CoC Donation Bot <span class="preview-tag">PREVIEW</span></div><div class="prototype-note">Clickable mockup · Simulated data · No connection to your bot</div><button style="padding:3px 9px;font-size:10px" onclick="resetDemo()">Reset preview</button></header>
<aside class="sidebar"><div class="brand"><span class="brand-icon" id="brand-icon"></span><div class="brand-text"><b>CoC Bot</b><div class="small muted">Control center</div></div></div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="row small"><span class="dot"></span> Preview device connected</div><label for="theme" class="eyebrow" style="display:block;margin-top:22px">Appearance</label><select id="theme" onchange="setTheme(this.value)"><option value="modern">Modern</option><option value="classic">Classic</option><option value="graphite">Graphite</option><option value="midnight">Midnight</option><option value="amethyst">Amethyst</option><option value="frost">Frost</option><option value="ember">Ember</option></select><p class="small muted" style="margin-top:13px">Your colors. A cleaner layout.</p></div></aside>
<main class="main"><div id="page"></div><footer class="footer"><span>Interactive design concept · Values are illustrative</span><span>Bot controls and settings are simulated locally</span></footer></main><div id="toast" class="toast" hidden role="status"></div><div id="modal" hidden></div>
<script>
const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',setup:'M9 5h12 M9 12h12 M9 19h12 M3 5l1 1 2-3 M3 12l1 1 2-3 M3 19l1 1 2-3',data:'M3 6h7l2 3h9v11H3z M3 6V4h6l2 2',diagnostics:'M3 12h4l3-7 4 14 3-7h4',shield:'M12 2l8 3v7c0 5-8 10-8 10S4 17 4 12V5z M8 12l3 3 5-6',check:'M5 12l4 4L19 6',arrow:'M5 12h14 M13 6l6 6-6 6',play:'M8 4l12 8-12 8z',stop:'M5 5h14v14H5z',image:'M3 3h18v18H3z M3 17l6-6 4 4 4-5 4 6 M8 7h.1',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.check}"/></svg>`}
const pages=['Dashboard','Settings','Setup','Data','Diagnostics'];let page='Dashboard',tab='Donations',running=false,dirty=false,selectedStep=2,logsOpen=false,toastTimer;let farm=5258,brk=9942;let taps=[];
const settings={open:true,enabled:true,farm:true,collect:true,abilities:false,preset:'Balanced',side:'Left',interval:7200,variance:600,session:18000,sessionvar:900,breakmin:600,breakmax:1800};
document.getElementById('brand-icon').innerHTML=icon('shield');
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')" aria-label="${p}" ${page===p?'aria-current="page"':''}>${icon(p.toLowerCase())}<span class="nav-label">${p}</span>${p==='Setup'?'<span class="count">1</span>':''}</button>`).join('')}
function go(p){page=p;nav();render();window.scrollTo(0,0)}
function heading(title,desc,extra=''){return `<div class="heading"><div><div class="eyebrow" style="margin-bottom:8px">Control center / ${title}</div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`}
function fmt(sec){return Math.floor(sec/3600)+'h '+String(Math.floor(sec%3600/60)).padStart(2,'0')+'m '+String(sec%60).padStart(2,'0')+'s'}
function scene(kind='village'){return `<svg viewBox="0 0 600 260" role="img" aria-label="Illustrative village map, not a game screenshot"><defs><pattern id="grid-${kind}" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M38 0H0V38" fill="none" stroke="currentColor" stroke-opacity=".07"/></pattern></defs><rect width="600" height="260" fill="url(#grid-${kind})"/><g transform="translate(300 122)"><path d="M0-102L183 0 0 102-183 0z" fill="var(--surface)" stroke="var(--raised)" stroke-width="2"/><path d="M0-75L136 0 0 75-136 0z M0-49L88 0 0 49-88 0z" fill="none" stroke="var(--muted)" stroke-opacity=".4" stroke-dasharray="4 4"/><g fill="var(--raised)" stroke="var(--muted)" stroke-opacity=".4"><path d="M0-25l35 20v33L0 48-35 28V-5z"/><path d="M-91-18l17 10v18l-17 10-17-10V-8z M91-18l17 10v18L91 20 74 10V-8z M0-82l17 10v18L0-44-17-54v-18z M0 59l17 10v18L0 97-17 87V69z"/></g><path d="M0-25l35 20L0 15-35-5z" fill="var(--accent)" fill-opacity=".4"/><circle cx="-140" cy="42" r="4" fill="var(--accent)"/><circle cx="-121" cy="54" r="4" fill="var(--accent)"/><circle cx="-100" cy="66" r="4" fill="var(--accent)"/></g></svg><span class="scene-caption">Illustration · Screenshot area preview</span>`}
function dashboard(){return heading('Dashboard','Everything you need to run the bot, at a glance.',`<span class="pill"><span class="dot"></span> Device connected</span>`)+`<div class="dashboard-grid"><section class="panel run-panel"><div class="row between"><span class="eyebrow">Bot control</span><span class="pill" id="status-pill">${running?'<span class="dot"></span> Running':'<span style="color:var(--muted)">●</span> Stopped'}</span></div><div class="run-title" id="run-title">${running?'Watching clan chat':'Ready when you are'}</div><p class="description" id="run-description">${running?'Checking requests and donating with elixir. Farming runs on your schedule.':'Start donations and scheduled farming. Stopping the bot leaves the game open.'}</p><div class="controls"><button class="primary" id="start-btn" onclick="startBot()" ${running?'disabled':''}>${icon('play')} &nbsp; Start bot</button><button class="danger" id="stop-btn" onclick="stopBot()" ${!running?'disabled':''}>${icon('stop')} &nbsp; Stop bot</button></div><div class="timers"><div><div class="small muted">Next farm attack</div><div class="timer" id="farm-time">${fmt(farm)}</div><div class="small muted" id="farm-note">${running?'Scheduled automatically':'Paused while stopped'}</div><div class="progress"><span style="width:38%"></span></div></div><div><div class="small muted">Next session break</div><div class="timer" id="break-time">${fmt(brk)}</div><div class="small muted" id="break-note">${running?'Session clock running':'Paused while stopped'}</div><div class="progress"><span style="width:55%"></span></div></div></div></section><section class="panel preview"><div class="panel-head"><h3>Game preview</h3><span class="small muted" id="preview-age">Illustrative</span></div><div class="scene">${scene()}</div><div class="preview-footer"><span class="small muted">See what the bot sees</span><button onclick="previewImage()">${icon('image')} &nbsp; View screenshot</button></div></section></div><div class="summary-strip"><span class="small muted">Donations <b>Enabled</b></span><span class="small muted">Open requests <b>Allowed</b></span><span class="small muted">Resource <b>Elixir only</b></span><span class="small muted">Timing <b>Balanced</b></span></div><section><div class="section-head"><h2>Recent activity</h2><button onclick="go('Diagnostics')" style="background:transparent;border:0;padding:0;color:var(--muted);font-size:12px">Open diagnostics ${icon('arrow')}</button></div><div class="activity-item"><time>14:42</time><span class="activity-icon">✓</span><div><strong>Donation complete</strong><div class="small muted">Requested troops and spells filled with elixir.</div></div></div><div class="activity-item"><time>14:41</time><span class="activity-icon">✓</span><div><strong>Returned to village</strong><div class="small muted">Clan chat opened to confirm the attack finished.</div></div></div><div class="activity-item"><time>14:37</time><span class="activity-icon">↗</span><div><strong>Scheduled farm attack</strong><div class="small muted">Your saved deployment sequence was used.</div></div></div><details ${logsOpen?'open':''} ontoggle="logsOpen=this.open"><summary>Detailed log</summary><div class="log">14:42:08 INFO &nbsp; Donation round complete<br>14:42:09 INFO &nbsp; Elixir selection verified<br>14:42:10 INFO &nbsp; Watching clan chat<br><span class="muted">Preview log · These events are simulated</span></div></details></section>`}
function toggle(key){settings[key]=!settings[key];dirty=true;render()}
function switcher(key){return `<button class="switch ${settings[key]?'on':''}" role="switch" aria-checked="${settings[key]}" aria-label="Toggle ${key}" onclick="toggle('${key}')"></button>`}
function setting(title,desc,control){return `<div class="setting-row"><div><h3>${title}</h3><p>${desc}</p></div><div class="setting-control">${control}</div></div>`}
function input(key,suffix='seconds'){return `<input aria-label="${key}" type="number" min="0" value="${settings[key]}" onchange="settings['${key}']=Math.max(0,Number(this.value));markDirty()"><span class="small muted">${suffix}</span>`}
function select(key,opts){return `<select aria-label="${key}" onchange="settings['${key}']=this.value;markDirty()">${opts.map(x=>`<option ${settings[key]===x?'selected':''}>${x}</option>`).join('')}</select>`}
function markDirty(){dirty=true;document.getElementById('savebar').hidden=false}
function settingsPage(){let content='';if(tab==='Donations')content=`<h2>Donation behavior</h2><p class="group-description">Choose which requests to fill and how quickly to interact.</p><div class="panel">${setting('Donate to clan requests','Fill requests using elixir. Gems are never a fallback.',switcher('enabled'))}${setting('Include open requests','Donate available units when the requester has not chosen specific troops.',switcher('open'))}${setting('Interaction speed','Balanced is a good starting point. Use a slower preset if taps are missed.',select('preset',['Careful','Balanced','Fast']))}</div><details><summary>Advanced donation timings</summary><div class="notice">The real app would expose raw timing values here when developer options are enabled.</div></details>`;
if(tab==='Farming')content=`<h2>Scheduled farming</h2><p class="group-description">Use your saved deployment sequence to collect resources.</p><div class="panel">${setting('Automatic farm attacks','Run attacks on a schedule while the bot is running.',switcher('farm'))}${setting('Attack interval','Time between automatic attacks. This countdown pauses when the bot stops.',input('interval'))}${setting('Interval variation','Vary each interval by up to this amount in either direction.',input('variance'))}${setting('Deployment side','Pan toward this side before playing your saved tap sequence.',select('side',['Left','Right']))}${setting('Deployment sequence','Edit the ordered taps used to select and deploy your army.','<button onclick="go(\'Setup\');selectedStep=4;render()">Edit sequence</button>')}</div>`;
if(tab==='Breaks')content=`<h2>Sessions and breaks</h2><p class="group-description">Give the game a rest after each active session.</p><div class="panel">${setting('Session length','How long the bot runs before a break. Stopped time does not count.',input('session'))}${setting('Session variation','Add or subtract up to this many seconds from the session length.',input('sessionvar'))}${setting('Minimum break','The shortest break before the bot opens the game again.',input('breakmin'))}${setting('Maximum break','The longest break before the bot opens the game again.',input('breakmax'))}</div>`;
if(tab==='Device')content=`<h2>Game connection</h2><p class="group-description">Connect to the Android device running your game.</p><div class="panel">${setting('Device address','The address shown by your Android environment. This is a demo value.','<input aria-label="Device address" value="android-device:5555" onchange="markDirty()">')}${setting('Connection health','Check that screenshots and game controls are available.','<button onclick="notify(\'Preview: connection check passed. No real device was contacted.\')">Test connection</button>')}</div><div class="notice">Changing resolution may require a different calibration profile. Your current profile would be preserved.</div>`;
if(tab==='Appearance')content=`<h2>Your workspace</h2><p class="group-description">Keep the colors you like across every page.</p><div class="panel">${setting('Theme','Try any existing palette. The layout stays consistent.',`<select aria-label="Theme" onchange="setTheme(this.value)">${['Modern','Classic','Graphite','Midnight','Amethyst','Frost','Ember'].map(x=>`<option ${document.getElementById('theme').value===x.toLowerCase()?'selected':''} value="${x.toLowerCase()}">${x}</option>`).join('')}</select>`)}${setting('Activity detail','Keep the dashboard readable and move technical messages to Diagnostics.','<span class="pill">Summary on dashboard</span>')}</div>`;
return heading('Settings','Everyday controls first. Technical details when you need them.')+`<div class="tabs">${['Donations','Farming','Breaks','Device','Appearance'].map(t=>`<button onclick="tab='${t}';render()" class="${tab===t?'active':''}">${t}</button>`).join('')}</div><section class="settings-group">${content}</section><div class="savebar" id="savebar" ${dirty?'':'hidden'}><div><b>Unsaved changes</b><div class="small muted">Only changes this mockup.</div></div><div class="row"><button onclick="dirty=false;render();notify('Preview changes dismissed.')">Discard</button><button class="primary" onclick="dirty=false;render();notify('Preview settings saved. Your real bot is unchanged.')">Save changes</button></div></div>`}
const steps=[{name:'Device connection',status:'Completed',title:'Connect your game',desc:'Make sure the bot can take a screenshot.',instructions:['Open your Android environment and launch Clash of Clans.','Enter the device address in Settings → Device.','Choose Test connection to check the screenshot and controls.']},{name:'Clan chat',status:'Completed',title:'Show the clan chat controls',desc:'Teach the bot where to open and close chat.',instructions:['Open Clash of Clans and go to your home village.','Click Capture screen, then mark the button that opens clan chat.','Open clan chat in the game. Capture again and mark the orange close arrow.']},{name:'Donation panel',status:'1 required part remaining',title:'Confirm the selected elixir button',desc:'Help the bot verify it is using elixir instead of gems.',instructions:['Open clan chat in the game and press Donate on a request.','At the top of the donation panel, select the elixir button beside Donation Resource.','Click Capture screen. Draw a box around the whole selected elixir button, including its border.','Review your selection, then save it. You can redo just this part later.']},{name:'Attack navigation',status:'Completed',title:'Show the attack controls',desc:'Calibrate each part directly, without repeating the entire step.',instructions:['Go to your home village, with clan chat closed.','Capture the screen and mark the Attack! button.','Open the attack menu and select the unranked mode. Calibrate the search button from that screen.']},{name:'Farm deployment',status:'Completed · Optional',title:'Edit your deployment sequence',desc:'Choose every troop, hero, and spell in the order you want.',instructions:['Start an unranked attack in the game and wait until an opponent is visible.','Use the pan action to move to your deployment edge, then capture that view.','In the editor, click each army slot and deployment position in order. Numbered circles show the tap order and jitter area.','Review the sequence and save. No attack is performed by this preview.']}];
function baseSetup(){let s=steps[selectedStep];return heading('Setup','Calibrate one part at a time. Your completed work stays saved.',`<button onclick="notify('Preview: your calibration backup has been created.')">Back up calibration</button>`)+`<div class="setup-summary"><span class="small muted"><b style="color:var(--text)">Almost ready</b> · 1 required part needs attention</span><div class="setup-progress"><div class="small muted">4 of 5 sections ready</div><div class="progress"><span style="width:80%"></span></div></div></div><div class="setup-grid"><section class="panel checklist"><div class="checklist-title eyebrow">Calibration checklist</div>${steps.map((s,i)=>`<button class="check-row ${i===selectedStep?'active':''}" onclick="selectedStep=${i};render()"><span class="${i===2?'accent':'green'}">${icon(i===2?'image':'check')}</span><span>${s.name}<small>${s.status}</small></span></button>`).join('')}</section><section class="panel step-guide"><div class="row between"><span class="eyebrow">${s.name}</span><span class="pill">${selectedStep===2?'Required':'Saved'}</span></div><h2>${s.title}</h2><p class="muted small">${s.desc}</p><div style="margin-top:20px"><label class="small muted" for="part">Jump directly to a part</label><select id="part" style="display:block;width:100%;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:10px;margin-top:6px" onchange="changePart(this.value)">${(selectedStep===2?['Selected elixir indicator','Elixir button','Troop grid','Spell grid','Donate button']:selectedStep===4?['Ordered tap sequence','Deployment edge']:selectedStep===1?['Open chat button','Close chat arrow','Clan tab']:selectedStep===3?['Attack! button','Unranked mode','Find opponent button','Return Home button']:['Device address','Screenshot check']).map(x=>`<option>${x}</option>`).join('')}</select></div><ol class="instructions" id="step-instructions">${s.instructions.map((t,i)=>`<li><span class="stepnum">${i+1}</span><span>${t}</span></li>`).join('')}</ol><div class="instruction-actions"><button class="primary" onclick="${selectedStep===4?'tapEditor()':'captureEditor()'}">${icon('image')} &nbsp; ${selectedStep===4?'Open tap editor':'Capture screen'}</button><button onclick="notify('Preview: this part is skipped. Your previous calibration is preserved.')">Skip this part</button></div><div class="compact-help">Redo only this part. No need to repeat completed sections.</div></section></div><details><summary>Backup, restore, and classic tools</summary><div class="row" style="margin-top:12px;flex-wrap:wrap"><button onclick="notify('Preview: choose a saved calibration to restore.')">Restore calibration</button><button onclick="go('Data')">Manage saved profiles</button><button onclick="notify('Preview: the terminal calibrator remains available as a fallback.')">Classic terminal calibrator</button></div></details>`}
function changePart(name){document.getElementById('step-instructions').innerHTML=`<li><span class="stepnum">1</span><span>Selected part: <strong>${name}</strong>. The finished app would show instructions tailored to this part.</span></li>`;notify('Preview: jumped to '+name)}
function dataPage(){return heading('Data','Screenshots and calibration profiles, in one place.',`<button onclick="notify('Preview: screenshot collection settings would open here.')">Collection settings</button>`)+`<div class="data-metrics"><div><span class="small muted">Screenshots saved today</span><strong>24 <span class="small muted">/ 200</span></strong></div><div><span class="small muted">Collection storage</span><strong>146 <span class="small muted">MB / 5 GB</span></strong></div><div><span class="small muted">Collection status</span><strong style="font-size:17px;padding-top:7px" class="green">Within limits</strong></div></div><div class="section-head"><h2>Recent screenshots</h2><span class="small muted">Illustrative collection</span></div><div class="gallery">${['Unusual donation panel','Battle results','New shop screen'].map((s,i)=>`<section class="panel shot"><div class="scene">${scene('shot'+i)}</div><div class="shot-info"><h3>${s}</h3><p>Today · Saved for review</p><button style="margin-top:12px;font-size:12px" onclick="previewImage()">Review screenshot</button></div></section>`).join('')}</div><div class="section-head" style="margin-top:32px"><h2>Calibration profiles</h2><button onclick="notify('Preview: current calibration saved as a new profile.')">Save current profile</button></div><div class="data-list">${['Main device','Backup before update'].map((s,i)=>`<div class="data-row"><div><h3>${s} ${!i?'<span class="pill" style="margin-left:8px">Current</span>':''}</h3><p>${!i?'Ready for this device':'Saved earlier · Calibration and templates included'}</p></div><div class="row"><button onclick="notify('Preview: profile selected. Your actual calibration is unchanged.')">${i?'Restore':'Export'}</button><button onclick="renameProfile(this)">Rename</button></div></div>`).join('')}</div>`}
function diagnostics(){return heading('Diagnostics','Test one action, understand a problem, and get back to running.',`<span class="pill"><span class="dot"></span> Demo health check passed</span>`)+`<div class="notice">These tools are simulated. In the finished app, action tests would run while the bot is stopped to prevent conflicting controls.</div><h2 style="margin-bottom:16px">Quick checks</h2><div class="panel">${[['Device connection','Check that the Android device responds and a screenshot can be captured.','Run check'],['Open clan chat','Test the calibrated chat button from your home village.','Test action'],['Recognize a request','Check whether a visible request asks for specific units or allows any units.','Inspect request'],['Verify elixir mode','Confirm the selected donation resource without donating anything.','Verify selection'],['Calibration health','Find missing files, invalid coordinates, or a changed screen size.','Check setup']].map(x=>`<div class="tool-row"><div><h3>${x[0]}</h3><p>${x[1]}</p></div><button onclick="notify('Preview: ${x[0]} test complete. No game action performed.')">${x[2]}</button></div>`).join('')}</div><details><summary>Developer tools</summary><div class="panel" style="margin-top:14px"><div class="tool-row"><div><h3>Simulate first launch</h3><p>Explore the guided setup with a separate temporary profile.</p></div><button onclick="go('Setup');notify('Preview: first-launch setup opened.')">Open simulation</button></div><div class="tool-row"><div><h3>Practice mode</h3><p>Inspect requests with donation taps disabled.</p></div>${switcher('abilities')}</div></div></details><div class="section-head" style="margin-top:28px"><h2>Detailed activity log</h2><button onclick="notify('Preview: diagnostic report prepared with simulated log entries.')">Export report</button></div><div class="log">14:42:08 INFO &nbsp; Donation round complete<br>14:42:09 INFO &nbsp; Elixir selection verified<br>14:42:10 INFO &nbsp; Watching clan chat<br>14:42:11 DEBUG &nbsp; Screenshot captured<br>14:42:11 INFO &nbsp; Transition check: donation → clan chat · valid<br><span class="muted">Preview log · Not connected to the running bot</span></div>`}
function render(){document.getElementById('page').innerHTML=({Dashboard:dashboard,Settings:settingsPage,Setup:setup,Data:dataPage,Diagnostics:diagnostics}[page])()}
function startBot(){running=true;render();notify('Preview started. Timers now count down; no real bot is running.')}
function stopBot(){running=false;render();notify('Preview stopped. Both timers pause; the game would stay open.')}
setInterval(()=>{if(!running)return;farm=Math.max(0,farm-1);brk=Math.max(0,brk-1);if(page==='Dashboard'){document.getElementById('farm-time').textContent=fmt(farm);document.getElementById('break-time').textContent=fmt(brk)}},1000);
function notify(t){clearTimeout(toastTimer);let el=document.getElementById('toast');el.textContent=t;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,4000)}
function showModal(html){let el=document.getElementById('modal');el.hidden=false;el.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Preview editor">${html}</section></div>`;el.querySelector('button')?.focus()}
function closeModal(){document.getElementById('modal').hidden=true}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function previewImage(){showModal(`<div class="row between"><h2>Game preview</h2><button onclick="closeModal()">Close</button></div><p class="small muted" style="margin-top:7px">Illustration only. The finished app would show a current screenshot.</p><div class="scene">${scene('modal')}</div><button onclick="notify('Preview refreshed. No real screenshot was requested.')">Refresh screenshot</button>`)}
function captureEditor(){showModal(`<div class="row between"><h2>Calibration preview</h2><button onclick="closeModal()">Close</button></div><p class="small muted" style="margin-top:10px">Select the elixir button in the game, then mark its full border. This preview shows the proposed editor layout.</p><div class="scene" style="background:var(--field)"><div style="text-align:center"><span class="eyebrow">Donation Resource</span><div class="row" style="margin-top:20px"><button class="primary" style="outline:2px dashed var(--accent);outline-offset:7px" onclick="notify('Preview: selected elixir button marked.')">Elixir · Selected</button><button onclick="notify('Choose elixir before capturing its selected indicator.')">Gems</button></div><p class="small muted" style="margin-top:27px">Illustrative controls, not a game screenshot</p></div></div><div class="row between"><span class="small muted">Include the button background and border.</span><button class="primary" onclick="closeModal();notify('Preview calibration saved. Actual calibration unchanged.')">Save selection</button></div>`)}
function tapEditor(){taps=[];showModal(`<div class="row between"><h2>Deployment sequence</h2><button onclick="closeModal()">Close</button></div><p class="small muted" style="margin-top:9px">Click the illustration to add numbered taps. This demonstrates the editor; it does not control the game.</p><div class="scene editor" onclick="addTap(event,this)">${scene('editor')}</div><div class="row between"><span class="small muted" id="tap-count">0 taps · Click to add</span><label class="small muted">Farm deploy jitter <input aria-label="Farm deploy jitter" type="range" min="0" max="20" value="6" oninput="updateJitter(this.value)"> <span id="jitter-value">6 px</span></label></div><div class="row between" style="margin-top:20px"><button onclick="undoTap()">Undo last tap</button><button class="primary" onclick="closeModal();notify('Preview sequence saved. Your actual sequence was not changed.')">Save sequence</button></div>`)}
function addTap(e,el){let r=el.getBoundingClientRect();taps.push([100*(e.clientX-r.left)/r.width,100*(e.clientY-r.top)/r.height]);drawTaps()}
function drawTaps(){let el=document.querySelector('.editor');el.querySelectorAll('.tap-marker').forEach(x=>x.remove());let jitter=Number(document.querySelector('[aria-label="Farm deploy jitter"]').value);taps.forEach((p,i)=>{let marker=document.createElement('span');marker.className='tap-marker';marker.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${Math.max(24,jitter*2)}px;height:${Math.max(24,jitter*2)}px`;marker.textContent=i+1;el.append(marker)});document.getElementById('tap-count').textContent=taps.length+' taps · Illustrative coordinates'}
function undoTap(){taps.pop();drawTaps()}
function updateJitter(n){document.getElementById('jitter-value').textContent=n+' px';drawTaps()}
function renameProfile(btn){let name=prompt('New name for this demo profile:');if(name&&name.trim()){btn.closest('.data-row').querySelector('h3').textContent=name.trim();notify('Preview profile renamed.')}}
const palettes={modern:['#1b2838','#171a21','#223447','#2a475e','#16202d','#c7d5e0','#9baaba','#66c0f4','#142232','#9cce72','#e58686'],classic:['#1b2838','#171a21','#2a475e','#3d5a73','#1e2329','#c7d5e0','#9daab5','#66c0f4','#1b2838','#beee11','#c45c5c'],graphite:['#202020','#252525','#2b2b2b','#373737','#1a1a1a','#ffffff','#b1b1b1','#60cdff','#001a26','#6ccb5f','#ff99a4'],midnight:['#000000','#0a0a0a','#1c1c1e','#2c2c2e','#121214','#f5f5f7','#9e9ea4','#0a84ff','#ffffff','#30d158','#ff453a'],amethyst:['#131313','#0e0e0e','#1d1b20','#2b2930','#211f26','#e6e1e5','#cac4d0','#d0bcff','#381e72','#4ade80','#f2b8b5'],frost:['#2e3440','#272c36','#343b48','#434c5e','#272d38','#eceff4','#b5c0d0','#88c0d0','#24313c','#a3be8c','#bf616a'],ember:['#201d1a','#171512','#2d2721','#41372c','#191612','#eee3d6','#b6a99a','#edb56f','#30200d','#a9c686','#df8a77']};
function setTheme(t){['bg','side','surface','raised','field','text','muted','accent','onaccent','green','red'].forEach((key,i)=>document.documentElement.style.setProperty('--'+key,palettes[t][i]));document.getElementById('theme').value=t;if(page==='Settings')render()}
function resetDemo(){running=false;dirty=false;farm=5258;brk=9942;page='Dashboard';setTheme('modern');nav();render();notify('Preview reset.')}
nav();render();
</script>

<script>
let selectedTheme='modern',libraryTab='Screenshots';const initialSettings=JSON.parse(JSON.stringify(settings));let savedSettings=JSON.parse(JSON.stringify(settings));
settings.intervalHours=2;settings.sessionHours=5;settings.breakMin=10;settings.breakMax=30;savedSettings=JSON.parse(JSON.stringify(settings));
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')" aria-label="${p==='Data'?'Library':p}" ${page===p?'aria-current="page"':''}>${icon(p.toLowerCase())}<span class="nav-label">${p==='Data'?'Library':p}</span></button>`).join('')}
function dashboard(){return heading('Dashboard','Start the bot. Everything else follows your settings.',`<a class="small muted" href="bot-redesign.html" style="text-decoration:none">Compare first design ↗</a>`)+`<section class="panel focus-panel"><div class="focus-top"><div><span class="pill" id="status-pill">${running?'<span class="dot"></span> Running':'Stopped'}</span><div class="run-title" id="run-title">${running?'Watching clan chat':'Ready when you are'}</div><p class="description">${running?'Checking requests. Your next attack and break are scheduled below.':'Donations and scheduled farming are ready. Stop leaves the game open.'}</p></div><div class="controls"><button class="primary" onclick="startBot()" ${running?'disabled':''}>${icon('play')} &nbsp; Start</button><button class="danger" onclick="stopBot()" ${!running?'disabled':''}>${icon('stop')} &nbsp; Stop</button><button onclick="notify('Preview: one farm attack requested. No real game action performed.')">Farm now</button></div></div><div class="timers"><div><div class="small muted">Next farm attack</div><div class="timer" id="farm-time">${fmt(farm)}</div><span class="small muted">${running?'Every 2 hours':'Paused while stopped'}</span></div><div><div class="small muted">Next break</div><div class="timer" id="break-time">${fmt(brk)}</div><span class="small muted">${running?'Active session time':'Paused while stopped'}</span></div><div><div class="small muted">Donation mode</div><div style="margin:9px 0 6px;font-size:16px">Elixir only</div><span class="small muted">${settings.open?'Specific + open requests':'Specific requests only'}</span></div></div></section><div class="subtle-meta"><span><span class="dot"></span> Preview device connected</span><span>Calibration ready</span><span>${settings.preset} timing</span></div><section class="dashboard-section"><div class="section-head"><h2>Recent activity</h2><button class="subtitle-link" onclick="go('Diagnostics')">View full log ${icon('arrow')}</button></div><div class="event-line"><time>14:42</time><p>Donation complete <span>· Requested troops and spells filled</span></p></div><div class="event-line"><time>14:41</time><p>Returned to village <span>· Clan chat confirmed</span></p></div><div class="event-line"><time>14:37</time><p>Scheduled farm attack <span>· Saved tap sequence used</span></p></div></section><div class="compact-help" style="margin-top:18px">Need to see the game? <button class="subtitle-link accent" onclick="go('Diagnostics');previewImage()">View current screenshot</button> in Diagnostics.</div>`}
function hours(key,label){return `<div class="inline-control"><input type="number" min="0.25" step="0.25" value="${settings[key]}" aria-label="${label}" onchange="settings['${key}']=Number(this.value);markDirty()"><span class="small muted">hours</span></div>`}
function saveDemo(){savedSettings=JSON.parse(JSON.stringify(settings));dirty=false;render();notify('Preview settings saved. Your actual settings are unchanged.')}
function discardDemo(){Object.assign(settings,savedSettings);dirty=false;render();notify('Unsaved preview changes discarded.')}
function settingsPage(){let content='';if(!['Routine','Breaks','Appearance'].includes(tab))tab='Routine';
if(tab==='Routine')content=`<section class="basic-section"><h2>Donations</h2><p class="group-description">Choose what the bot fills.</p><div class="panel">${setting('Enable donations','Fill clan requests using elixir, never gems.',switcher('enabled'))}${setting('Include open requests','Also fill requests where any troop or spell is welcome.',switcher('open'))}${setting('Interaction speed','Choose Careful if taps are missed. Exact delays are available below.',select('preset',['Careful','Balanced','Fast']))}</div></section><section class="basic-section"><h2>Farm attacks</h2><p class="group-description">Run your saved army sequence on a schedule.</p><div class="panel">${setting('Automatic farming','Run scheduled attacks while the bot is started.',switcher('farm'))}${setting('Attack every','Stopped time does not count toward the next attack.',hours('intervalHours','Attack interval in hours'))}${setting('Deployment sequence','Change your army by editing its ordered taps.','<button onclick="go(\'Setup\');selectedStep=4;render()">Edit sequence</button>')}</div></section><details><summary>Advanced farming and timing</summary><div class="panel" style="margin-top:12px">${setting('Attack interval variation','Add or subtract up to this many seconds from each interval.',input('variance'))}${setting('Deployment side','Move the camera to this side before running the tap sequence.',select('side',['Left','Right']))}${setting('Developer options','In the real app, enable this to edit individual delays in milliseconds.',switcher('abilities'))}</div></details>`;
if(tab==='Breaks')content=`<section class="basic-section"><h2>Sessions and breaks</h2><p class="group-description">Two everyday controls. Extra adjustments below.</p><div class="panel">${setting('Take a break after','Only time spent running the bot counts toward this session.',hours('sessionHours','Session length in hours'))}${setting('Break duration','Choose a minimum and maximum. Each break falls within this range.',`<div class="inline-control"><input aria-label="Minimum break in minutes" type="number" min="1" value="${settings.breakMin}" onchange="settings.breakMin=Number(this.value);markDirty()"><span class="muted">–</span><input aria-label="Maximum break in minutes" type="number" min="1" value="${settings.breakMax}" onchange="settings.breakMax=Number(this.value);markDirty()"><span class="small muted">min</span></div>`)}</div></section><details><summary>Advanced session timing</summary><div class="panel" style="margin-top:12px">${setting('Session length variation','Add or subtract up to this many seconds from each session.',input('sessionvar'))}</div></details>`;
if(tab==='Appearance')content=`<section class="basic-section"><h2>Appearance</h2><p class="group-description">One theme selector for the entire app.</p><div class="panel">${setting('Theme','Keep your familiar colors with this simplified layout.',`<select aria-label="Theme" onchange="setTheme(this.value)">${Object.keys(palettes).map(x=>`<option value="${x}" ${selectedTheme===x?'selected':''}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}</select>`)}</div></section>`;
return heading('Settings','A few everyday choices. Advanced controls stay tucked away.')+`<div class="settings-page"><div class="tabs">${['Routine','Breaks','Appearance'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${content}<div class="savebar" id="savebar" ${dirty?'':'hidden'}><span>Unsaved preview changes</span><div class="row"><button onclick="discardDemo()">Discard</button><button class="primary" onclick="saveDemo()">Save changes</button></div></div></div>`}
const originalSetup=baseSetup;
function setup(){let html=originalSetup();html=html.replace(/<button onclick="notify\('Preview: your calibration backup has been created\.'\)">Back up calibration<\/button>/,'<button onclick="go(\'Data\');libraryTab=\'Saved calibrations\';render()">Saved calibrations</button>');html=html.replace(/<details><summary>Backup, restore, and classic tools<\/summary>[\s\S]*?<\/details>/,'<details><summary>Advanced setup tools</summary><div class="row" style="margin-top:12px;flex-wrap:wrap"><button onclick="notify(\'Preview: setup health check passed. No real files inspected.\')">Check calibration</button><button onclick="notify(\'Preview: terminal calibration remains available as a fallback.\')">Classic terminal calibrator</button></div></details>');return html}
function dataPage(){let content=libraryTab==='Screenshots'?`<div class="subtle-meta"><span>24 saved today / 200 limit</span><span>146 MB / 5 GB</span><span class="green">Collection within limits</span></div><div class="gallery">${['Unusual donation panel','Battle results','New shop screen'].map((s,i)=>`<section class="panel shot"><div class="scene">${scene('lean'+i)}</div><div class="shot-info"><h3>${s}</h3><p>Today · Saved for review</p><button style="margin-top:12px;font-size:12px" onclick="previewImage()">Review</button></div></section>`).join('')}</div><details class="collection-options"><summary>Screenshot collection settings</summary><div class="panel" style="margin-top:12px">${setting('Collect useful screenshots','Save unusual screens for review without changing game actions.',switcher('collect'))}${setting('Daily image limit','Pause collection after this many images are saved.','<input aria-label="Daily image limit" type="number" value="200" min="1" onchange="notify(\'Preview collection limit updated.\')">')}${setting('Storage limit','Pause collection when this limit is reached. Existing images stay saved.','<div class="inline-control"><input aria-label="Storage limit in GB" type="number" value="5" min="1" onchange="notify(\'Preview storage limit updated.\')"><span class="small muted">GB</span></div>')}</div></details>`:`<div class="notice">Saved calibrations include coordinates and reference images. Backups and device profiles live here together.</div><div class="section-head"><h2>Saved calibrations</h2><button onclick="notify('Preview: a copy of your current calibration was saved.')">Save current calibration</button></div><div class="saved-list">${['Main device','Before latest update'].map((s,i)=>`<div class="data-row"><div><h3>${s} ${i?'':'<span class="pill">Current</span>'}</h3><p>${i?'Backup · Saved before the last update':'Device profile · All required parts ready'}</p></div><div class="profile-actions"><button onclick="notify('Preview: restore selected. Actual calibration unchanged.')">Restore</button><button onclick="renameProfile(this)">Rename</button><button onclick="notify('Preview: calibration archive prepared for sharing.')">Export</button></div></div>`).join('')}</div><button style="margin-top:20px" onclick="notify('Preview: choose a calibration archive to import.')">Import calibration</button>`;
return heading('Library','Your saved screenshots and calibrations.')+`<div class="tabs library-tabs">${['Screenshots','Saved calibrations'].map(t=>`<button class="${libraryTab===t?'active':''}" onclick="libraryTab='${t}';render()">${t}</button>`).join('')}</div>${content}`}
function diagnostics(){return heading('Diagnostics','A small toolbox for when something needs attention.')+`<div class="panel"><div class="tool-row"><div><h3>Current screenshot</h3><p>See what the bot sees on demand. No permanent dashboard preview.</p></div><button onclick="previewImage()">View screenshot</button></div><div class="tool-row"><div><h3>Connection check</h3><p>Check the device and screenshot capture. Connection details are in Setup.</p></div><button onclick="notify('Preview: device connection healthy.')">Run check</button></div><div class="tool-row"><div><h3>Test a single action</h3><p>Try chat navigation, request recognition, or elixir verification.</p></div><button onclick="actionPicker()">Choose action</button></div></div><div class="section-head" style="margin-top:30px"><h2>Technical log</h2><button onclick="notify('Preview: diagnostic report prepared with simulated entries.')">Export report</button></div><div class="log">14:42:08 INFO &nbsp; Donation round complete<br>14:42:09 INFO &nbsp; Elixir selection verified<br>14:42:10 INFO &nbsp; Watching clan chat<br>14:42:11 DEBUG &nbsp; Screenshot captured<br>14:42:11 INFO &nbsp; Transition check: donation → clan chat · valid<br><span class="muted">Simulated log · No connection to your actual bot</span></div><details><summary>Developer tools</summary><div class="tools-actions dev-section"><button onclick="go('Setup');notify('Preview first-launch setup opened.')">Simulate first launch</button><button onclick="notify('Preview: practice mode enabled; no real game actions.')">Practice mode</button><button class="danger" onclick="notify('Preview: game shutdown requested. Nothing was actually closed.')">Close game and Waydroid</button></div></details>`}
function actionPicker(){showModal(`<div class="row between"><h2>Test one action</h2><button onclick="closeModal()">Close</button></div><p class="small muted" style="margin:12px 0 20px">These tests would run while the bot is stopped.</p><div class="tools-actions">${['Open clan chat','Inspect request','Verify elixir mode','Relaunch game'].map(x=>`<button onclick="notify('Preview: ${x} test complete.')">${x}</button>`).join('')}</div>`)}
function setTheme(t){selectedTheme=t;['bg','side','surface','raised','field','text','muted','accent','onaccent','green','red'].forEach((key,i)=>document.documentElement.style.setProperty('--'+key,palettes[t][i]));if(page==='Settings')render()}
function resetDemo(){running=false;dirty=false;farm=5258;brk=9942;Object.assign(settings,initialSettings,{intervalHours:2,sessionHours:5,breakMin:10,breakMax:30});savedSettings=JSON.parse(JSON.stringify(settings));page='Dashboard';tab='Routine';libraryTab='Screenshots';setTheme('modern');nav();render();notify('Simplified preview reset.')}
document.querySelector('.side-bottom').innerHTML='<div class="small muted"><span class="dot"></span> Device connected</div><div class="small muted" style="margin-top:5px">Simulation only</div>';
nav();render();
</script>

<style>
.eyebrow,.footer,.compact-help,.group-description,.subtle-meta,.notice,.prototype-note,.brand-text .small,.side-bottom .small+div{display:none!important}
.heading{margin-bottom:26px}.heading p,.heading .eyebrow{display:none}.heading h1{font-size:25px;font-weight:600}.main{padding-top:78px}.basic-section>h2,.section-head>h2{display:none}.basic-section{margin-bottom:20px}.section-head{justify-content:flex-end;margin-bottom:8px}.focus-top .description{display:none}.focus-top .run-title{font-size:23px;margin-top:14px}.focus-panel{padding:28px}.focus-panel .timers{margin-top:28px}.focus-panel .timers .timer+.small{display:none}.focus-panel .timers>div:last-child>.small:last-child{display:none}.focus-panel .timers>div:last-child>div:not(.small){margin-top:13px!important}.dashboard-section{padding-top:25px}.event-line span{display:none}.setting-row p,.tool-row p,.shot-info p,.data-row p{display:none}.setting-row{padding:18px 22px}.tool-row{padding:18px 22px}.setting-row h3,.tool-row h3{font-weight:500}.instructions{margin:20px 0}.checklist-title{display:none}.step-guide>.muted{display:none}.step-guide h2{font-size:19px}.setup-summary .small.muted>b{font-weight:500}.scene-caption{display:none}.topbar{height:40px}.sidebar{top:40px}.topbar .preview-tag{font-size:10px}.side-bottom{padding-bottom:4px}.summary-strip{display:none}.shot-info{padding:16px}.data-row{padding:17px 0}details{margin-top:17px}.step-guide .instruction-actions{padding-top:18px}.log>.muted{display:none}
</style>
<script>
function heading(title,desc,extra=''){if(title==='Dashboard')extra='';return `<div class="heading"><h1>${title}</h1>${extra}</div>`}
const minimalRender=render;
render=function(){minimalRender();document.querySelectorAll('.setting-row,.tool-row').forEach(row=>{const desc=row.querySelector('p');const label=row.querySelector('h3');if(desc&&label){label.title=desc.textContent;label.style.cursor='help';row.querySelectorAll('input,select,button').forEach(el=>el.title=desc.textContent)}})};
document.querySelector('.footer').remove();
document.querySelector('.prototype-note').remove();
document.querySelector('.brand-text .small').remove();
document.querySelector('.side-bottom').innerHTML='<div class="small muted"><span class="dot"></span> Demo device connected</div>';
nav();render();
</script>
</body></html>
