name: Offline regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
      - run: pnpm --dir web test
      - name: Require rebuilt browser assets
        run: git diff --exit-code -- src/coc_bot/web/static
  offline:
    # Match the OCR engine shipped in the CasaOS image; ubuntu-latest moves.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Upgrade confirmation fixtures require Tesseract with English language data.
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb tesseract-ocr tesseract-ocr-eng
      # Capacity OCR/torch are optional at runtime and unnecessary for these checks.
      # Include the web and web-test dependencies used by test_web_interface.
      - run: python -m pip install opencv-python-headless numpy pillow pyyaml loguru 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'websockets>=13,<18' 'httpx>=0.27,<1' 'httpx2>=2,<3' && python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_farm_offline.py
      - run: python scripts/verify_smart_collection.py
      - run: python scripts/verify_battle_completion.py
      - run: xvfb-run -a python scripts/verify_gui_offline.py
