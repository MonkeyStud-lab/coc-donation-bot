adb:
  # ADB address for the Android session — run `adb devices` to find yours.
  # Common values: 127.0.0.1:5555 or a host:port shown by adb (Waydroid often uses a LAN IP).
  device: "127.0.0.1:5555"
  coc_package: "com.supercell.clashofclans"
  reconnect_max_attempts: 5
  reconnect_backoff_seconds: 2

vision:
  template_threshold: 0.82
  donate_button_threshold: 0.78
  scale_range: [0.95, 1.0, 1.05]
  ocr_confidence_threshold: 0.5

timing:
  tap_jitter_px: 6
  action_delay_ms: [120, 350]
  scan_interval_ms: [800, 1500]
  anti_idle_seconds: 60   # small screen nudge so CoC does not idle-kick

runtime:
  session_limit_seconds: 14400           # base seconds before a forced break (4 hours)
  session_limit_variance_seconds: 300    # random ±N seconds around session limit (0 = exact)
  break_min_seconds: 600                 # 10 minutes
  break_max_seconds: 900                 # 15 minutes
  game_load_timeout_seconds: 90
  state_watchdog_seconds: 45

donation:
  order: ["troop", "spell", "siege"]
  handled_request_ttl_seconds: 120
  chat_max_scroll_attempts: 20
  bar_max_scroll_attempts: 5       # troop bar scrolls to reach siege (~4–5 needed)
  spell_bar_max_scroll_attempts: 2 # spell bar needs fewer scrolls
  donate_open_requests: true      # fill open requests by tapping colored slots; specific still uses stop-at-grey
  parse_request_capacity: false   # optional EasyOCR of 0/35 bars (slow; not needed for simple fill)
  donation_panel_wait_seconds: 3.0

# Your clan's level — sets max housing/count YOU can donate per action.
# Limits are loaded from config/clan_perks.yaml (March 2025 Clash Anytime values).
clan:
  level: 8

# Unranked Battle farming via programmed deploy tap sequence. Requires farm calibration.
farm:
  engine: sequence               # sequence | planner (saved routine) | automatic (built-in Electro Dragons)
  enabled: false
  resource_start_percent: 75     # refill if any unlocked resource falls below this
  resource_target_percent: 95    # finish a refill when all unlocked resources reach this
  deploy_side: left               # default side when programming a new sequence
  pan_swipes: 3                   # default pans when programming a new sequence
  deploy_jitter_px: 6             # jitter for farm deploy sequence taps only
  match_timeout_seconds: 120      # clouds / Find a Match
  battle_timeout_seconds: 210     # max wait from first deploy; confirmed results can return earlier
  retry_cooldown_seconds: 300     # only when farm fails before deploy (menu/matchmaking)

builder_base:
  progression_enabled: false
  collect_resources: false
  research_enabled: false
  elixir_reserve: 100000
  attacks_enabled: false
  upgrades_enabled: false
  interval_seconds: 3600
  builders_reserved: 0
  gold_reserve: 100000

progression:
  enabled: false
  rearrange: true
  clear_obstacles: false
  clear_seasonal_obstacles: false

upgrades:
  buildings_enabled: false
  research_enabled: false
  pets_enabled: false
  pets_include_assigned: false
  interval_seconds: 900
  builders_reserved: 1
  gold_reserve: 1000000
  elixir_reserve: 2000000
  dark_elixir_reserve: 50000
  excluded_names: ""

layouts:
  enabled: false
  replace_inactive: false

# Control window (GUI)
gui:
  show_debug_activity: false      # DEBUG lines in Home activity log (noisy; leave off normally)
  # Theme ids: classic | modern | windows11 (Graphite) | ios26 (Midnight) |
  # android17 (Amethyst) | nord (Frost) | ember (Ember)
  # (legacy key ui_style still accepted)
  theme: modern
  timing_preset: balanced         # safe | balanced | fast | custom
  dev_options: false              # when true, Settings shows raw timing ms fields
  practice_mode: false            # when true, Start runs without donate taps (dry-run)

# Passive collection is opt-in and never changes game actions.
collection:
  enabled: false
  daily_limit: 200
  storage_gb: 5.0
