name: CasaOS container image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/casaos/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: coc-bot-casaos:candidate
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify fresh-profile assets without Android or network
        run: docker run --rm --network none --entrypoint python coc-bot-casaos:candidate /app/packaging/casaos/verify_image.py
      - name: Publish verified candidate
        run: |
          docker tag coc-bot-casaos:candidate "$IMAGE:casaos-$GITHUB_SHA"
          docker push "$IMAGE:casaos-$GITHUB_SHA"
          docker tag coc-bot-casaos:candidate "$IMAGE:casaos"
          docker push "$IMAGE:casaos"
