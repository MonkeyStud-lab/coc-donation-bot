name: Offline regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      # Capacity OCR/torch are optional at runtime and unnecessary for these checks.
      - run: python -m pip install opencv-python-headless numpy pillow pyyaml loguru && python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_farm_offline.py
      - run: python scripts/verify_smart_collection.py
      - run: python scripts/verify_battle_completion.py
      - run: xvfb-run -a python scripts/verify_gui_offline.py
